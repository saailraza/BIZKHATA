<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3B2E">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--g9:#0A2A20;--g8:#0F3B2E;--g7:#1A5240;--g6:#2B6B55;--b0:#FFFDF8;--b1:#FBF7EE;--b2:#F3EBDA;--b3:#E6D9BD;--b4:#CDBB93;--ink:#16251E;--mut:#6C7567;--pos:#1E6B4E;--neg:#A3412B;--warn:#B8832B;--r:14px;--sw:272px;
--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--b2);color:var(--ink);font:15px/1.45 var(--sans)}
button,input,select,textarea{font-family:inherit}
a{color:var(--g7)}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:25px;line-height:1.15}h2{font-size:19px;line-height:1.2}h3{font-size:17px}
.ic{flex:none;vertical-align:middle}
.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:700}.r{text-align:right}.c{text-align:center}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.num{font-variant-numeric:tabular-nums}

/* ===== layout: sidebar + main ===== */
.side{position:fixed;top:0;bottom:0;left:0;width:var(--sw);max-width:86vw;background:var(--g8);color:var(--b2);z-index:40;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .25s ease;box-shadow:6px 0 24px rgba(0,0,0,.25)}
.side.open{transform:none}
.sb-head{padding:calc(env(safe-area-inset-top) + 16px) 16px 14px;display:flex;gap:11px;align-items:center;border-bottom:1px solid var(--g7)}
.sb-head .bn{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.1;letter-spacing:.12em}
.sb-head .cn{font-size:12px;color:var(--b4);max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-nav{flex:1;overflow-y:auto;padding:6px 10px 14px}
.sb-sec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--b4);margin:16px 10px 5px;opacity:.85;font-weight:700}
.sb-nav a,.sb-nav button.li{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--b3);text-decoration:none;font-size:14.5px;font-weight:600;width:100%;background:none;border:0;cursor:pointer;text-align:left;margin-bottom:2px}
.sb-nav a:hover,.sb-nav button.li:hover{background:rgba(243,235,218,.08)}
.sb-nav a.on{background:rgba(243,235,218,.15);color:#fff}
.sb-nav .tag{margin-left:auto;color:var(--b4);display:flex}
.sb-nav .cntb{margin-left:auto;background:#E8B54A;color:#2c1f00;border-radius:99px;font-size:11.5px;font-weight:700;padding:1px 8px}
.sb-foot{border-top:1px solid var(--g7);padding:11px 14px calc(11px + env(safe-area-inset-bottom));font-size:12.5px;color:var(--b4)}
.sb-foot b{display:block;color:var(--b2);font-size:13.5px}
.scrim{position:fixed;inset:0;background:rgba(10,42,32,.5);z-index:35;display:none}
.scrim.on{display:block}
.main{min-width:0;min-height:100vh}
.hdr{position:sticky;top:0;z-index:20;background:var(--g8);color:var(--b2);padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;display:flex;align-items:center;gap:10px}
.hdr .hb{background:rgba(243,235,218,.12);border-color:transparent;color:var(--b2)}
.hdr .ttl{min-width:0}.hdr .bn{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .cn{font-size:12px;color:var(--b4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sp{flex:1}
.hdr img.lg{width:36px;height:36px;border-radius:10px;object-fit:cover;background:var(--b2)}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 60px}
.ph{margin:6px 2px 14px}.ph p{margin:5px 0 0;color:var(--mut)}
@media(min-width:700px){.wrap{max-width:900px;padding:18px 22px 60px}}
@media(min-width:1024px){
  .side{transform:none;box-shadow:none;max-width:none}
  .main{margin-left:var(--sw)}
  .hb,.scrim,.scrim.on{display:none!important}
  .wrap{max-width:1120px;padding:24px 32px 70px}
  .hdr{padding-left:28px;padding-right:28px}
  h1{font-size:29px}
}

/* cards, forms */
.card{background:var(--b0);border:1px solid var(--b3);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card>h3,.card>h2{margin-bottom:10px}
.fld{margin-bottom:11px}
.fld label,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--g7);margin-bottom:4px}
input,select,textarea{width:100%;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--b4);border-radius:10px;padding:10px 12px;min-height:46px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--g6);box-shadow:0 0 0 3px rgba(43,107,85,.18)}
input[disabled],select[disabled]{background:var(--b2);color:var(--mut)}
input[type=checkbox]{width:20px;height:20px;min-height:0;padding:0;accent-color:var(--g7);flex:none}
input[type=file]{padding:9px;font-size:14px}
.ms.pk{display:flex;gap:11px;align-items:center}
.ms.pk i{width:21px;height:21px;border:2px solid var(--g7);border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:14px;line-height:1}
.ms.pk.on{background:var(--b1)}.ms.pk.on i{background:var(--g8);border-color:var(--g8)}.ms.pk.on i:after{content:'\2713'}
.mstools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.sb-foot a,.auth .foot a{color:inherit;text-decoration:underline;font-weight:700}
.tk{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--b3);padding:11px 2px;cursor:pointer;color:var(--ink);font:inherit}
.tk .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.tk b{font-size:15px}
.tkm{border-radius:12px;padding:9px 12px;margin:8px 0;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.tkm.u{background:var(--b1);border:1px solid var(--b3)}.tkm.a{background:#E4F1EA;border:1px solid #BCD9C9}
.tkm small{display:block;color:var(--mut);font-size:11.5px;margin-bottom:3px}
.pwrap{position:relative}.pwrap input{padding-right:48px}
.pwb{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;color:var(--g7);display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;padding:0}
.pwb:active{background:var(--b2)}
.chk{display:flex;align-items:flex-start;gap:10px;margin:8px 0;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--g8);color:var(--b1);font:600 15px var(--sans);cursor:pointer;width:100%;text-decoration:none}
.btn:active{background:var(--g9)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--g8);border:1.5px solid var(--g8)}
.btn.tan{background:var(--b3);color:var(--g9)}
.btn.danger{background:var(--neg);color:#fff}
.btn.s{min-height:38px;padding:0 13px;font-size:13.5px;width:auto}
.btn+.btn{margin-top:8px}
.btn.s+.btn.s{margin-top:0}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--b3);background:var(--b1);color:var(--g8);display:inline-grid;place-items:center;cursor:pointer;padding:0}
.ib.red{color:var(--neg)}
.row{display:flex;gap:10px;align-items:center}.row.end{justify-content:flex-end}.row.sb{justify-content:space-between}.row.fw{flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2 .fld{margin-bottom:0}.g2{margin-bottom:11px}
@media(max-width:380px){.g2.rs{grid-template-columns:1fr}}
.lnk{background:none;border:0;color:var(--g7);font-weight:600;font-size:13px;padding:4px 0;cursor:pointer;text-decoration:underline}
.search{position:relative;margin-bottom:10px}.search input{padding-left:40px}.search .ic{position:absolute;left:12px;top:13px;color:var(--mut)}
.sel{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--b4);border-radius:10px;background:#fff;font-size:16px;text-align:left;cursor:pointer;color:var(--ink)}
.sel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel.ph span{color:var(--mut)}.sel .ic{color:var(--mut)}
.pklist{max-height:52vh;overflow:auto;margin:0 -4px}
.pk{display:block;width:100%;text-align:left;padding:12px 8px;border:0;border-bottom:1px solid var(--b3);background:none;font-size:15px;cursor:pointer;color:var(--ink)}
.pk:hover,.pk:active{background:var(--b2)}

/* badges + banners */
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.st-full{background:#CFE5DA;color:#0F3B2E}.st-partial{background:#E8DAB4;color:#5C4510}.st-trial{background:#F6E3B0;color:#6A4A06}.st-suspended,.st-rejected{background:#EFCFC6;color:#7A2A18}.st-pending{background:#D5DEEA;color:#27415F}
.t-Income{background:#CFE5DA;color:#0F3B2E}.t-Expense{background:#EFCFC6;color:#7A2A18}
.banner{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:#F6E3B0;color:#5A3F05}.banner.bad{background:#EFCFC6;color:#6B2413}.banner.info{background:#D5DEEA;color:#27415F}
.banner a{font-weight:700}
.empty{text-align:center;padding:26px 14px;color:var(--mut)}.empty.small{padding:16px}
.empty h2{color:var(--ink);margin:10px 0 6px}

/* dashboard */
.hero{background:var(--g8);color:var(--b2);border-radius:20px;padding:18px 16px 16px 30px;margin-bottom:12px;position:relative;overflow:hidden;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(243,235,218,.08) 31px 32px)}
.hero:before{content:'';position:absolute;left:16px;top:0;bottom:0;width:1px;background:rgba(205,187,147,.45)}
.hero .k{font-size:13px;color:var(--b4)}
.hero .big{font-family:var(--serif);font-size:38px;font-weight:700;line-height:1.1;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(243,235,218,.12);border-radius:10px;padding:6px 10px;font-size:12.5px}
.chip b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.qa .btn{min-height:56px;font-size:15.5px}.qa .btn+.btn{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--b0);border:1px solid var(--b3);border-radius:var(--r);padding:12px}
.stat .k{font-size:12.5px;color:var(--mut)}.stat .v{font-family:var(--serif);font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:8px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
.bp{flex:1;width:100%;display:flex;gap:3px;align-items:flex-end}
.bp i{flex:1;border-radius:4px 4px 0 0;min-height:2px;display:block}
.br{background:var(--g7)}.bq{background:var(--b4)}
.bcol span{font-size:11px;color:var(--mut)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dgrid{display:grid;gap:12px}
@media(min-width:900px){.dgrid.two{grid-template-columns:1fr 1fr}.dgrid.two .card{margin-bottom:0}}

/* entries */
.rowcard{background:var(--b1);border:1px solid var(--b3);border-radius:12px;padding:11px;margin-bottom:10px}
.rowcard .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;color:var(--g7);font-size:13px}
.rowcard .fld{margin-bottom:9px}
.totalbar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--g8);color:var(--b2);border-radius:12px;padding:12px 14px;margin:6px 0 12px}
.totalbar b{font-family:var(--serif);font-size:24px;font-variant-numeric:tabular-nums}
.ecard{background:var(--b0);border:1px solid var(--b3);border-radius:var(--r);padding:12px;margin-bottom:10px}
.ecard .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ecard .amt{font-family:var(--serif);font-weight:700;font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lines{list-style:none;margin:8px 0;padding:8px 0;border-top:1px dashed var(--b4);border-bottom:1px dashed var(--b4)}
.lines li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}
.lines li i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.ecard .f{display:flex;gap:8px;justify-content:flex-end}
@media(min-width:1024px){.elist{display:grid;grid-template-columns:1fr 1fr;gap:10px}.elist .ecard{margin-bottom:0}.elist>.btn,.elist>.empty{grid-column:1/-1}}

/* tables */
.tw{overflow-x:auto;margin:0 -4px;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:100%}
.tbl th{background:var(--b2);color:var(--g8);text-align:left;padding:8px 8px;font-weight:700;white-space:nowrap;border-bottom:1px solid var(--b4)}
.tbl td{padding:8px;border-bottom:1px solid var(--b3);vertical-align:top}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:700;background:var(--b2);border-top:1.5px solid var(--g8)}
.tbl tr.sec td{font-weight:700;color:var(--g8);background:var(--b1);padding-top:12px}
.rep h2{margin-bottom:2px}.rep .sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--b3);font-size:15px}
.kv.big{font-weight:700;font-size:16.5px;border-bottom:2px solid var(--g8)}
.rbar{display:flex;gap:8px;margin-bottom:12px}.rbar .btn{flex:1;margin:0}
.sig{display:flex;justify-content:space-between;margin-top:46px;font-size:13px}.sig div{border-top:1px solid var(--ink);padding-top:5px;min-width:42%;text-align:center}

/* lists */
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--b3)}
.item:last-child{border-bottom:0}
.item .l{min-width:0}.item .l b{display:block;overflow-wrap:anywhere}
.item .rt{text-align:right;white-space:nowrap}
.grp{font-weight:700;color:var(--g7);padding:10px 8px 2px;font-family:var(--serif)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:12px}
.cc{background:var(--b0);border:1px solid var(--b3);border-radius:var(--r);padding:13px}
.cc.flag{border-color:#D9A08F;box-shadow:inset 4px 0 0 var(--neg)}
.cc dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0;font-size:13.5px}.cc dt{color:var(--mut)}.cc dd{margin:0;overflow-wrap:anywhere}
.cc .acts{display:flex;gap:6px;flex-wrap:wrap}
.cnt{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-bottom:12px}
.cnt div{background:var(--b0);border:1px solid var(--b3);border-radius:12px;padding:9px;text-align:center}
.cnt b{display:block;font-family:var(--serif);font-size:22px}.cnt span{font-size:12px;color:var(--mut)}
.bill{background:var(--b0);border:1px solid var(--b3);border-radius:var(--r);padding:12px;margin-bottom:10px;display:grid;gap:6px}
.bill .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bill .amt{font-family:var(--serif);font-weight:700;font-size:20px;white-space:nowrap}
.bill.over{border-color:#D9A08F;background:#FDF3EF}
.bill .f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* auth */
.auth{min-height:100vh;display:flex;flex-direction:column}
.auth .top{background:var(--g8);color:var(--b2);padding:calc(env(safe-area-inset-top) + 30px) 22px 62px;position:relative;overflow:hidden;text-align:center;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(243,235,218,.07) 31px 32px)}
.auth .top>div{display:flex;flex-direction:column;align-items:center}
.auth .top svg{display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.auth .top h1{font-size:30px;margin:14px 0 0;letter-spacing:.14em;line-height:1.1;padding-left:.14em}
.auth .top p{margin:8px 0 0;color:var(--b4);font-size:13.5px;max-width:300px}
.auth .box{max-width:460px;width:100%;margin:-34px auto 0;padding:0 14px 30px;position:relative}
.auth .card{padding:18px 16px;box-shadow:0 8px 24px rgba(10,42,32,.10)}
.auth .card h2{text-align:center;margin-bottom:4px}
.auth .card .hint{text-align:center;margin:0 0 14px}
.auth .foot{text-align:center;color:var(--mut);font-size:12.5px;padding:0 0 24px;margin-top:auto}
.auth .top>div{max-width:460px;margin:0 auto}
.gate{max-width:560px;margin:0 auto;padding:22px 14px 60px}
.gate .card{text-align:center;padding:24px 18px}
.gate .card h2{margin:10px 0 8px}

/* modal + toast */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,42,32,.55);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--b1);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin-bottom:10px}.sheet p{margin:0 0 14px}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:20px}}
#toasts{position:fixed;left:12px;right:12px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--g9);color:var(--b1);padding:11px 16px;border-radius:12px;font-size:14px;max-width:440px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--neg)}

/* print preview */
#printSheet{display:none}
body.printing>*:not(#printSheet){display:none!important}
body.printing{background:#fff}
body.printing #printSheet{display:block;max-width:760px;margin:0 auto;padding:14px;background:#fff;color:#000}
#printSheet .bar{display:flex;gap:10px;margin-bottom:16px}#printSheet .bar .btn{flex:1;margin:0}
#printSheet .ph1{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--g8);padding-bottom:10px;margin-bottom:12px}
#printSheet .ph1 img{width:54px;height:54px;object-fit:contain}
#printSheet h2{margin:8px 0 2px}
#printSheet .card{border:0;padding:0;background:none}
#printSheet .tbl th{background:#eee}
#printSheet .foot{margin-top:24px;font-size:11px;color:#666;text-align:center}
@media print{body.printing{background:#fff}.noprint{display:none!important}@page{margin:12mm}}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .25s ease}@keyframes up{from{transform:translateY(8px);opacity:0}}}
@media(prefers-reduced-motion:reduce){.side{transition:none}}
.ss-h{display:none!important}
.ssp{position:fixed;z-index:200;background:#fff;border:1px solid var(--b4);border-radius:14px;box-shadow:0 14px 36px rgba(10,42,32,.28);padding:10px;display:flex;flex-direction:column}
.ssp .search{margin-bottom:6px;flex:none}
.ssp .ssl{overflow:auto;min-height:0;flex:1;margin:0 -4px}
.pk.on{font-weight:700}.pk.hl{background:var(--b2)}
.sel:disabled{opacity:.6;cursor:not-allowed}
.vals{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

body.ur,body.ur input,body.ur select,body.ur textarea,body.ur button{font-family:'Noori Nastaleeq','Jameel Noori Nastaleeq','Noto Nastaliq Urdu',serif}
body.ur{font-size:17px;line-height:2.1}body.ur h1,body.ur h2,body.ur h3{font-family:inherit;line-height:1.9}
body.ur input,body.ur select{line-height:1.8}
.khdr{position:sticky;top:0;z-index:20;background:var(--g8);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:8px}
.khdr .kt{flex:1;min-width:0}.khdr .shop{font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.5}
.khdr .bk{font-size:11px;letter-spacing:.16em;color:var(--b4);font-weight:700;font-family:var(--sans);line-height:1.2}
.khdr button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:6px 12px;font-weight:700;font-size:15px;cursor:pointer}
.kwrap{max-width:560px;margin:0 auto;padding:14px 14px 20px}
.kfoot{text-align:center;font-size:12.5px;color:var(--mut);padding:6px 14px calc(18px + env(safe-area-inset-bottom));line-height:1.5}
.ktiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ktile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:128px;border-radius:18px;color:#fff;text-decoration:none;font-size:19px;font-weight:700;text-align:center;padding:12px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.ktile.wide{grid-column:1/-1;min-height:100px}
.kseg{display:flex;gap:8px}.kseg button{flex:1;padding:10px 6px;border:2px solid var(--b3);background:#fff;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;color:var(--ink)}
.kseg button.on{background:var(--g8);color:#fff;border-color:var(--g8)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kst{background:#fff;border:1px solid var(--b3);border-radius:14px;padding:10px 12px}.kst.wide{grid-column:1/-1;background:var(--g8);color:#fff}

.kp{width:100%;background:none;border:0;border-bottom:1px solid var(--b2);font:inherit;color:inherit;text-align:inherit;cursor:pointer}
.ktot{border-top:2px solid var(--b3);margin-top:4px}
.kbank{white-space:pre-wrap;background:var(--b1);border:1px dashed var(--b4);border-radius:10px;padding:10px;margin:8px 0}

.kauth{min-height:100vh;max-width:480px;margin:0 auto;background:var(--b1);display:flex;flex-direction:column}
.kah{background:var(--g8);color:#fff;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px}
.kah img{width:48px;height:48px;border-radius:12px;background:#fff;object-fit:contain;flex:none}
.kah .t{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.1em;line-height:1.3}
.kah .s{font-size:12px;color:#9fd3b8;font-family:var(--sans);line-height:1.5}
.kah>div{flex:1;min-width:0}.kah button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.kab{flex:1;padding:22px 18px}.kab h2{font-size:23px;margin-bottom:16px}
.kab .fld label{font-weight:700;font-size:13.5px}
.kab .fld input{border-radius:14px;background:#F7F1E3;border:1px solid var(--b3);padding:13px 14px;font-size:15px}
.kgold,.kdark{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15.5px;cursor:pointer;margin-top:12px}
.kgold{background:#C9A55C;color:#2c1f00}.kdark{background:var(--g8);color:#fff}
.kaf{text-align:center;font-size:12.5px;color:var(--mut);padding:12px 14px calc(16px + env(safe-area-inset-bottom));line-height:1.5}
.kaf a{font-weight:700}

.kland{direction:ltr;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:40px;padding:12px;background:linear-gradient(135deg,var(--b2),var(--b1));--sw:1;--sh:1}
.kstw{--sc:min(var(--sw),var(--sh));width:calc(800px*var(--sc));height:calc(720px*var(--sc));flex:none}
.kstage{position:relative;width:800px;height:720px;transform:scale(var(--sc));transform-origin:0 0}
.kpho{position:absolute;left:173px;top:173px;width:624px;height:547px;border-radius:30px;overflow:hidden;box-shadow:0 18px 40px rgba(15,59,46,.28)}
.kpho img{width:100%;height:100%;object-fit:cover;display:block}
.kphone{position:absolute;left:10px;top:10px;width:340px;height:700px;background:#111;border-radius:48px;padding:11px;box-shadow:0 26px 50px rgba(0,0,0,.45)}
.knotch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:110px;height:24px;background:#111;border-radius:0 0 16px 16px;z-index:3}
.kscr{height:100%;border-radius:38px;overflow-x:hidden;overflow-y:auto;scrollbar-width:none;background:var(--b1)}
.kscr::-webkit-scrollbar{display:none}
.kscr .kauth{min-height:100%;max-width:none}
.kscr .kah{background:none;color:var(--g8);padding:40px 18px 0;justify-content:flex-end}
.kscr .kah img,.kscr .kah .t,.kscr .kah .s{display:none}.kscr .kah button{background:var(--g8);color:#fff}
.kscr .kab{padding:12px 22px 6px}.kscr .kab h2{font-size:25px;margin-bottom:10px;line-height:1.5}
.kscr .kab p.hint{margin:-4px 0 8px!important;line-height:1.6}
.kscr .fld{margin-bottom:12px}.kscr .fld label{line-height:1.6;margin-bottom:3px}
.kscr .fld input{padding:13px 14px}
.kscr .kgold,.kscr .kdark{padding:14px 8px;margin-top:12px;font-size:14.5px;white-space:nowrap}
.kscr .kaf{padding:8px 10px 14px}
body.ur .kscr{line-height:1.7}body.ur .kscr .fld label,body.ur .kscr p{line-height:1.6}
.kbrand{max-width:330px}.kbrand img{width:110px;height:110px;border-radius:24px;background:#fff;box-shadow:0 8px 22px rgba(15,59,46,.2)}
.kbrand h1{font-size:44px;letter-spacing:.1em;color:var(--g8);margin:18px 0 6px}.kbrand p{font-size:19px;color:var(--g7);margin:0 0 16px}

body.ur .kbrand li{padding:7px 26px 7px 0}body.ur .kbrand li:before{left:auto;right:0}

 .kscr .kab{padding:22px 18px}.kscr .kab h2{font-size:23px;margin-bottom:16px}.kscr .fld{margin-bottom:14px}.kscr .fld input{padding:13px 14px}

 .kstw{width:auto;height:auto;display:block}

}

<script>
'use strict';
window.STANDALONE = true;
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const fmt=n=>{n=r2(n);if(n===0)return '0';return (n<0?'-':'')+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:2})};
const money=n=>'Rs '+fmt(n);
const ymd=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>ymd(new Date());
const monthStart=()=>today().slice(0,8)+'01';
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const dmy=d=>d?d.split('-').reverse().join('-'):'';

const SA_MK = 'bk_master_v1', SA_SK = id => 'bk_shop_' + id;
const sPad = n => String(n).padStart(2, '0');

const sAddD = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return sY(d); };

const sMob = s => { let d = String(s == null ? '' : s).replace(/\D/g, ''); if (d.startsWith('0092')) d = '0' + d.slice(4); else if (d.startsWith('92') && d.length >= 12) d = '0' + d.slice(2); return d; };
const S_MOBILE = /^03\d{9}$/;
const sErr = (code, msg, extra, status) => { const e = new Error(msg || code); e.code = code; e.status = status || 400; e.data = Object.assign({ error: msg || code, code }, extra || {}); return e; };

/* ---------- password hashing (PBKDF2 in the browser) ---------- */
const sHex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');

  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 60000, hash: 'SHA-256' }, key, 256);
  return 'p1$' + sHex(salt) + '$' + sHex(new Uint8Array(bits));

}

const sLog = (shopId, actor, action, detail) => { SM.log.push({ shopId: shopId || null, actor, action, detail: String(detail || '').slice(0, 300), at: Date.now() }); if (SM.log.length > 3000) SM.log.splice(0, 500); S_DIRTY = true; };

/* ---------- billing / status rules ---------- */
function sBlockReason(s, due) {
  if (s.status === 'pending' || s.status === 'rejected') return s.status;
  if (s.status === 'suspended') return s.autoSusp ? 'trial_ended' : 'suspended';
  if (s.status === 'trial' && s.trialEnds < Date.now()) return 'trial_ended';
  const lim = sAddD(sToday(), -SM.settings.grace_days);
  return due.some(b => b.due < lim) ? 'overdue' : null;
}
function sCreateBill(shopId, amount, due, note, monthly, auto) {
  if (monthly && SM.bills.some(b => b.shopId === shopId && b.monthly && b.due === due)) throw sErr('DUPLICATE', 'A monthly bill for this due date already exists');
  SM.counters.bill++;
  const b = { id: sUid(), shopId, no: 'INV-' + String(SM.counters.bill).padStart(4, '0'), amount: sR2(amount), issue: sToday(), due, status: 'due', paidAt: null, note: note || 'Monthly subscription', monthly: !!monthly, auto: !!auto, at: Date.now() };
  SM.bills.push(b); S_DIRTY = true; return b;
}
function sPayBill(b) {
  if (!b || b.status === 'paid') return b;
  b.status = 'paid'; b.paidAt = Date.now();
  const s = SM.shops.find(x => x.id === b.shopId);
  if (s && b.monthly) { const n = sAddM(b.due, 1); if (!s.nextDue || s.nextDue < n) s.nextDue = n; }
  S_DIRTY = true; return b;
}
function sSweep() {
  for (const s of SM.shops) if (s.status === 'trial' && s.trialEnds < Date.now()) { s.status = 'suspended'; s.autoSusp = true; S_DIRTY = true; }
  const lim = sAddD(sToday(), SM.settings.bill_advance_days);
  for (const s of SM.shops) {
    if (!['full', 'partial'].includes(s.status) || !s.nextDue || s.nextDue > lim) continue;
    const fee = s.fee > 0 ? s.fee : SM.settings.monthly_fee; if (!(fee > 0)) continue;
    if (!SM.bills.some(b => b.shopId === s.id && b.monthly && b.due === s.nextDue)) sCreateBill(s.id, fee, s.nextDue, 'Monthly subscription', true, true);
  }
}
const sFeeOf = s => (s.fee > 0 ? s.fee : SM.settings.monthly_fee);
const sShopView = (s, extra) => Object.assign({ id: s.id, name: s.name, owner: s.owner, status: s.status, autoSuspended: !!s.autoSusp, registeredAt: s.registeredAt, trialEnds: s.trialEnds, daysLeft: Math.max(0, Math.ceil((s.trialEnds - Date.now()) / 864e5)), fee: s.fee || 0, nextDue: s.nextDue || '' }, extra || {});
function sMobileTaken(m, exceptUserId) { return SM.users.some(u => u.mobile === m && u.id !== exceptUserId) || SM.admins.some(a => String(a.login).toLowerCase() === m); }

async function sCreateShop({ name, mobile, shop, password, status = 'trial', actor }) {
  name = sStr(name, 80); shop = sStr(shop, 100); mobile = sMob(mobile);
  if (!name || !shop || !password) throw sErr('FIELDS', 'Please fill every field');
  if (!S_MOBILE.test(mobile)) throw sErr('BAD_MOBILE', 'Mobile number must be 11 digits and start with 03');
  if (String(password).length < 4) throw sErr('SHORT_PASS', 'Password needs at least 4 characters');
  if (sMobileTaken(mobile)) throw sErr('MOBILE_TAKEN', 'This mobile number is already registered');
  const st = SM.settings, now = Date.now();
  const s = { id: sUid(), name: shop, owner: name, status, registeredAt: now, trialEnds: now + st.trial_days * 864e5, autoSusp: false, fee: 0, nextDue: null };
  const u = { id: sUid(), shopId: s.id, name, mobile, hash: await sHash(String(password)), active: true, at: now };
  SM.shops.push(s); SM.users.push(u);
  if (status === 'trial' && st.monthly_fee > 0) sCreateBill(s.id, st.monthly_fee, sY(new Date(now + st.trial_days * 864e5)), 'Monthly subscription (first month)', true, true);
  sPut(SA_SK(s.id), sNewShop());                        // this shop's own separate storage
  sLog(s.id, actor || mobile, 'Registered', status === 'trial' ? 'Auto approved, ' + st.trial_days + ' day trial' : 'Created by admin: ' + status);
  return { shop: s, user: u };
}

/* ---------- balance rules ---------- */
function sAssert(d) {
  const kindOf = id => (d.parties.find(p => p.id === id) || {}).kind;
  for (const mode of ['cash', 'bank']) {
    const ev = {}, add = (dt, i, o) => { const e = ev[dt] || (ev[dt] = [0, 0]); e[0] += i; e[1] += o; };
    d.sales.forEach(x => x.type === mode && add(x.date, x.amount, 0)); d.income.forEach(x => x.type === mode && add(x.date, x.amount, 0));
    d.purchases.forEach(x => x.type === mode && add(x.date, 0, x.amount)); d.expenses.forEach(x => x.type === mode && add(x.date, 0, x.amount));
    d.settlements.forEach(x => { if (x.mode !== mode) return; if (kindOf(x.partyId) === 'customer') add(x.date, x.amount, 0); else add(x.date, 0, x.amount); });
    let run = 0;
    for (const dt of Object.keys(ev).sort()) { run = sR2(sR2(run + ev[dt][0]) - ev[dt][1]); if (run < 0) throw sErr(mode === 'cash' ? 'NEG_CASH' : 'NEG_BANK', 'Not enough ' + mode + ' balance', { date: dt, short: sR2(-run) }); }
  }
  const pe = {}, addp = (id, dt, i, o) => { const p = pe[id] || (pe[id] = {}); const e = p[dt] || (p[dt] = [0, 0]); e[0] += i; e[1] += o; };
  d.sales.forEach(x => x.partyId && addp(x.partyId, x.date, x.amount, 0)); d.purchases.forEach(x => x.partyId && addp(x.partyId, x.date, x.amount, 0)); d.settlements.forEach(x => addp(x.partyId, x.date, 0, x.amount));
  for (const id of Object.keys(pe)) {
    let run = 0;
    for (const dt of Object.keys(pe[id]).sort()) { run = sR2(sR2(run + pe[id][dt][0]) - pe[id][dt][1]); if (run < 0) throw sErr('NEG_PARTY', 'Party balance would go below zero', { date: dt, party: (d.parties.find(p => p.id === id) || {}).name, short: sR2(-run) }); }
  }
}
function sMutate(ctx, fn) { const d = JSON.parse(JSON.stringify(sData(ctx.shop))); const out = fn(d); sAssert(d); sCommit(ctx.shop, d); return out; }

const sPartyBal = (d, p, to) => {
  const le = x => !to || x.date <= to, base = p.kind === 'customer' ? d.sales : d.purchases;
  return sR2(base.filter(x => x.partyId === p.id && le(x)).reduce((a, x) => a + x.amount, 0) - d.settlements.filter(x => x.partyId === p.id && le(x)).reduce((a, x) => a + x.amount, 0));
};
function sMoney(d, mode, to) {
  const le = x => !to || x.date <= to, sum = (a, f) => a.filter(x => x.type === mode && le(x)).reduce((t, x) => t + x.amount, 0);
  const st = d.settlements.filter(x => x.mode === mode && le(x)).reduce((t, x) => t + ((d.parties.find(p => p.id === x.partyId) || {}).kind === 'customer' ? x.amount : -x.amount), 0);
  return sR2(sum(d.sales) + sum(d.income) - sum(d.purchases) - sum(d.expenses) + st);
}
const S_KINDS = {
  sales: { key: 'sales', party: 'customer', udhar: true, sheet: 'Sale' }, purchases: { key: 'purchases', party: 'supplier', udhar: true, sheet: 'Purchase' },
  income: { key: 'income', udhar: false, sheet: 'Other Income' }, expenses: { key: 'expenses', udhar: false, sheet: 'Other Expenses' },
};
const sKind = k => { const c = S_KINDS[k]; if (!c) throw sErr('NOT_FOUND', 'Unknown entry type', {}, 404); return c; };
function sResolveParty(d, k, b) {
  if (b.partyId && b.partyId !== '__new') { const p = d.parties.find(x => x.id === b.partyId && x.kind === k.party); if (!p) throw sErr('PARTY', 'Select the party name'); return p.id; }
  const pn = sStr(b.partyNew, 100); if (!pn) throw sErr('PARTY', 'Select or type the party name');
  const ex = d.parties.find(x => x.kind === k.party && x.key === sNorm(pn)); if (ex) return ex.id;
  const p = { id: sUid(), kind: k.party, name: pn, key: sNorm(pn) }; d.parties.push(p); return p.id;
}
function sSaveEntry(ctx, k, b, id) {
  const name = sStr(b.name, 150), amount = sR2(b.amount), type = String(b.type || ''), date = sCheckDate(b.date);
  if (!name) throw sErr('NAME', 'Please fill in the name'); if (!(amount > 0)) throw sErr('AMOUNT', 'Enter the amount');
  if (!(k.udhar ? ['cash', 'bank', 'udhar'] : ['cash', 'bank']).includes(type)) throw sErr('TYPE', 'Choose cash, bank or udhar');
  return sMutate(ctx, d => {
    const partyId = type === 'udhar' ? sResolveParty(d, k, b) : null, arr = d[k.key];
    const row = { id: id || sUid(), date, name, desc: k.udhar ? sStr(b.desc, 200) : '', type, amount, partyId, at: Date.now() };
    if (id) { const i = arr.findIndex(x => x.id === id); if (i < 0) throw sErr('NOT_FOUND', 'Entry not found', {}, 404); row.at = arr[i].at; arr[i] = row; } else arr.push(row);
    return row.id;
  });
}
function sSaveSettle(ctx, b, id) {
  const amount = sR2(b.amount), mode = String(b.mode || ''), date = sCheckDate(b.date);
  if (!(amount > 0)) throw sErr('AMOUNT', 'Enter the amount'); if (!['cash', 'bank'].includes(mode)) throw sErr('TYPE', 'Choose cash or bank');
  return sMutate(ctx, d => {
    const p = d.parties.find(x => x.id === b.partyId); if (!p) throw sErr('PARTY', 'Select the party name');
    const row = { id: id || sUid(), date, partyId: p.id, amount, mode, at: Date.now() };
    if (id) { const i = d.settlements.findIndex(x => x.id === id); if (i < 0) throw sErr('NOT_FOUND', 'Entry not found', {}, 404); row.at = d.settlements[i].at; d.settlements[i] = row; } else d.settlements.push(row);
    return row.id;
  });
}

const S_CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

A.doRegister = async () => {

  if (password.length < 4) return toast(L(...ERR.SHORT_PASS), 'err');

  if (password.length < 4) return toast(L(...ERR.SHORT_PASS), 'err');

  toast(L('درخواست ایڈمن کو بھیج دی گئی۔ منظوری کے بعد نئے پاسورڈ سے لاگ ان کریں۔', 'Request sent to admin. After approval, log in with the new password.')); go('login');
};

/* ===================== router ===================== */
async function render() {
  const my = ++RID; closeModal();
  const h = route(), app = $('#app');
  if (!TOKEN) { applyLang(false); app.innerHTML = (AUTH[h] || AUTH.login)(); return; }
  if (ROLE === 'admin') { applyLang(true); return renderAdmin(h, my); }
  applyLang(false);
  let me; try { me = await api('/me'); } catch (e) { if (e.code !== 'AUTH') app.innerHTML = `<div class="kwrap"><div class="banner bad"><div>${errMsg(e)}</div></div><button class="btn" onclick="location.reload()">OK</button></div>`; return; }
  if (my !== RID) return;
  if (me.blocked) {
    const bd = await api('/billing'); if (my !== RID) return;
    app.innerHTML = gateHtml(me, bd); window.scrollTo(0, 0); return;
  }
  const pg = KP[h] ? h : 'home';
  let body; try { body = await KP[pg](me); } catch (e) { if (e.code === 'BLOCKED') return render(); if (e.code !== 'AUTH') toast(errMsg(e), 'err'); return; }
  if (my !== RID) return;
  app.innerHTML = kHead(me, pg !== 'home') + `<main class="kwrap">${kBanner(me)}${body}</main><div class="kfoot">${RIGHTS}</div>`;
  window.scrollTo(0, 0);
}

function downloadB64(r) {

  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([u8], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })); a.download = r.filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

A.sPlan = async d => {
  const r = await api('/admin/shops/' + d.id), s = r.shop, st = s.status === 'pending' ? 'trial' : s.status;
  modal(`<h3>${esc(s.name)} — plan</h3><div class="fld"><label>Status</label><select id="pl_st" data-native="1">${opts([['pending', 'Pending'], ['trial', 'Trial'], ['partial', 'Partial'], ['full', 'Full access'], ['suspended', 'Blocked'], ['rejected', 'Rejected']], st)}</select></div>${F('pl_fee', 'Monthly fee (blank = default fee)', { type: 'number', v: s.fee || '', attr: 'min="0"' })}${F('pl_due', 'Next due date (paid plans)', { type: 'date', v: s.nextDue || '' })}${F('pl_trial', 'Trial days (when set to Trial)', { type: 'number', v: 7, attr: 'min="1"' })}<label class="chk"><input type="checkbox" id="pl_gen"> Create the bill for this due date now</label><div class="row end"><button class="btn ghost s" data-a="closeModal">Cancel</button><button class="btn s" data-a="sPlanSave" data-id="${s.id}">Save</button></div>`);
};
A.sPlanSave = async d => { await api('/admin/shops/' + d.id + '/plan', 'POST', { status: V('pl_st'), fee: num(V('pl_fee')), nextDue: V('pl_due'), trialDays: num(V('pl_trial')), generateBill: $('#pl_gen').checked }); closeModal(); toast('Saved'); render(); };
A.sBlock = d => kConfirmEn('Block this company? Only the billing screen will show to them.', async () => { await api('/admin/shops/' + d.id + '/block', 'POST'); toast('Blocked'); render(); });
A.sEdit = async d => {
  const r = await api('/admin/shops/' + d.id), s = r.shop;
  modal(`<h3>Edit company</h3>${F('ed_shop', 'Shop name', { v: s.name })}${F('ed_owner', 'Owner name', { v: s.ownerName })}${F('ed_cell', 'Mobile number (login ID)', { type: 'tel', v: s.mobile, attr: kMobAttr })}${F('ed_pass', 'New password (leave empty to keep)', { type: 'password' })}<div class="row end"><button class="btn ghost s" data-a="closeModal">Cancel</button><button class="btn s" data-a="sEditSave" data-id="${s.id}">Save</button></div>`);
};
A.sEditSave = async d => { await api('/admin/shops/' + d.id, 'PUT', { name: V('ed_shop'), owner: V('ed_owner'), mobile: V('ed_cell'), password: $('#ed_pass').value }); closeModal(); toast('Saved'); render(); };
function kConfirmEn(msg, fn) { modal(`<p style="margin:0 0 12px">${msg}</p><div class="row end"><button class="btn ghost s" data-a="closeModal">Cancel</button><button class="btn danger s" id="kcY">Yes</button></div>`); $('#kcY').onclick = async () => { closeModal(); try { await fn(); } catch (e) { toast(errMsg(e), 'err'); } }; }
A.sDel = d => kConfirmEn(`Delete <b>${esc(d.n)}</b> and its whole separate database? This cannot be undone.`, async () => { await api('/admin/shops/' + d.id, 'DELETE'); toast('Deleted'); go('s-companies'); });

AP['s-approvals'] = async () => {
  const d = await api('/admin/approvals'); ACNT = d.payments.length + d.resets.length + d.registrations.length;
  const sec = (t, rows, empty) => `<div class="card"><h3>${t}</h3>${rows.length ? rows.join('') : `<div class="empty small">${empty}</div>`}</div>`;
  const body =
    sec(`Payment slips (${d.payments.length})`, d.payments.map(p => `<div class="item"><div class="l"><b>${esc(p.shop)}</b><span class="mut sm">${esc(p.mobile)} · ${esc(p.bill)} · ${money(p.amount)} · ${dts(p.at)}</span></div><div class="rt"><button class="btn s" data-a="payReview" data-id="${p.id}">Review</button></div></div>`), 'No payments waiting.') +
    sec(`Password reset requests (${d.resets.length})`, d.resets.map(r => `<div class="item"><div class="l"><b>${esc(r.shop)}</b><span class="mut sm">${esc(r.mobile)} · ${dts(r.at)}</span></div><div class="rt"><button class="btn s" data-a="resetReview" data-id="${r.id}" data-n="${esc(r.shop)}" data-m="${esc(r.mobile)}">Review</button></div></div>`), 'No password requests.') +
    sec(`New registrations (${d.registrations.length})`, d.registrations.map(r => `<div class="item"><div class="l"><b>${esc(r.shop)}</b><span class="mut sm">${esc(r.owner)} · ${esc(r.mobile)}</span></div><div class="rt"><button class="btn s" data-a="sPlan" data-id="${r.id}">Approve</button></div></div>`), 'No registrations waiting.') +
    sec('Recently handled', d.handled.map(h => `<div class="item"><div class="l"><b>${h.type}</b><span class="mut sm">${esc(h.shop)}${h.detail ? ' · ' + money(Number(h.detail)) : ''}</span></div><div class="rt"><span class="badge ${h.status === 'approved' ? 'st-full' : 'st-rejected'}">${h.status}</span></div></div>`), 'Nothing handled yet.');
  return { title: 'Approvals', sub: 'Payment slips, password resets and new registrations.', body };
};
A.payReview = async d => {
  const r = await api('/admin/payments/' + d.id + '/slip');
  modal(`<h3>Payment slip</h3><div style="max-height:56vh;overflow:auto;margin:8px 0"><img src="${r.slip}" alt="Payment slip" style="max-width:100%;border-radius:10px"></div><div class="row end fw"><button class="btn ghost s" data-a="closeModal">Cancel</button><button class="btn ghost s" data-a="payNo" data-id="${d.id}">Reject</button><button class="btn s" data-a="payOk" data-id="${d.id}">Approve &amp; activate</button></div>`);
};
A.payOk = async d => { await api('/admin/payments/' + d.id + '/approve', 'POST'); closeModal(); toast('Payment approved — ID activated'); render(); };
A.payNo = async d => { await api('/admin/payments/' + d.id + '/reject', 'POST'); closeModal(); toast('Rejected'); render(); };
A.resetReview = d => modal(`<h3>Password reset · ${esc(d.n)}</h3><p class="mut sm">Mobile: <b>${esc(d.m)}</b><br>Approve only after you have confirmed it is really the shopkeeper (for example by calling this number). The new password they chose will be set.</p><div class="row end fw"><button class="btn ghost s" data-a="closeModal">Cancel</button><button class="btn ghost s" data-a="resetNo" data-id="${d.id}">Reject</button><button class="btn s" data-a="resetOk" data-id="${d.id}">Approve</button></div>`);
A.resetOk = async d => { await api('/admin/resets/' + d.id + '/approve', 'POST'); closeModal(); toast('Password updated'); render(); };
A.resetNo = async d => { await api('/admin/resets/' + d.id + '/reject', 'POST'); closeModal(); toast('Rejected'); render(); };

let BF = '';
AP['s-billing'] = async () => {
  const d = await api('/admin/bills?status=' + BF), s = d.stats;
  const stat = (k, v, c) => `<div class="stat"><div class="k">${k}</div><div class="v ${c || ''}">${v}</div></div>`;
  const body = `<div class="stats">${stat('Unpaid', money(s.unpaid), s.unpaid ? 'neg' : '')}${stat('Overdue', money(s.overdue), s.overdue ? 'neg' : '')}${stat('Received', money(s.received), 'pos')}${stat('Bills', s.count)}</div>
  <div class="card"><div class="row sb fw"><select data-native="1" onchange="BF=this.value;render()" style="width:auto">${opts([['', 'All bills'], ['due', 'Due'], ['overdue', 'Overdue'], ['paid', 'Paid']], BF)}</select><button class="btn s" data-a="billNew">+ New bill</button></div></div>
  <div class="card">${d.bills.length ? d.bills.map(b => `<div class="item"><div class="l"><b>${esc(b.no)} · ${esc(b.shop)}</b><span class="mut sm">${money(b.amount)} · Due ${dmy(b.due)} · ${esc(b.note)}</span></div><div class="rt"><span class="badge ${b.status === 'paid' ? 'st-full' : b.overdue ? 'st-suspended' : 'st-pending'}">${b.status === 'paid' ? 'Paid' : b.overdue ? 'Overdue' : 'Due'}</span>${b.status === 'due' ? ` <button class="btn s" data-a="billPay" data-id="${b.id}">Mark paid</button>` : ''} <button class="ib red" data-a="billDel" data-id="${b.id}" aria-label="Delete">${ic('trash', 16)}</button></div></div>`).join('') : '<div class="empty">No bills.</div>'}</div>`;
  window._shops = d.shops;
  return { title: 'Billing', sub: 'Monthly bills are created automatically ' + 7 + ' days before the due date.', body };
};
A.billNew = () => modal(`<h3>New bill</h3><div class="fld"><label>Company</label><select id="bn_shop" data-native="1">${opts((window._shops || []).map(s => [s.id, s.name]), '')}</select></div>${F('bn_amt', 'Amount (Rs)', { type: 'number', attr: 'min="0"' })}${F('bn_due', 'Due date', { type: 'date', v: today() })}${F('bn_note', 'Note', { v: 'Monthly subscription' })}<label class="chk"><input type="checkbox" id="bn_m" checked> Monthly subscription bill</label><div class="row end"><button class="btn ghost s" data-a="closeModal">Cancel</button><button class="btn s" data-a="billNewSave">Create</button></div>`);
A.billNewSave = async () => { await api('/admin/bills', 'POST', { shopId: V('bn_shop'), amount: num(V('bn_amt')), due: V('bn_due'), note: V('bn_note'), monthly: $('#bn_m').checked }); closeModal(); toast('Bill created'); render(); };
A.billPay = async d => { await api('/admin/bills/' + d.id + '/pay', 'POST'); toast('Marked paid'); render(); };
A.billDel = d => kConfirmEn('Delete this bill?', async () => { await api('/admin/bills/' + d.id, 'DELETE'); render(); });

AP['s-settings'] = async () => {
  const s = await api('/admin/settings');
  const body = `<div class="card"><h3>Shopkeeper billing</h3>${F('st_fee', 'Default monthly fee (Rs)', { type: 'number', v: s.monthlyFee || '', attr: 'min="0"' })}<div class="fld"><label for="st_bank">Bank account details (shown to shopkeepers for payment)</label><textarea id="st_bank" rows="4">${esc(s.bankDetails)}</textarea></div>${F('st_wa', 'Support WhatsApp number (with country code, e.g. 923084535456)', { v: s.whatsapp })}${F('st_trial', 'Free trial days', { type: 'number', v: s.trialDays, attr: 'min="1"' })}${F('st_grace', 'Grace days after due date', { type: 'number', v: s.graceDays, attr: 'min="0"' })}</div>
  <div class="card"><h3>Admin login</h3>${F('st_aname', 'Admin name', { v: s.adminName })}${F('st_alogin', 'Login ID', { v: s.adminLogin, attr: 'autocapitalize="none"' })}${F('st_apass', 'New password (leave empty to keep)', { type: 'password' })}<button class="btn" data-a="stSave">Save settings</button></div>`;
  return { title: 'Settings', sub: 'Fee, bank details, trial and grace days, admin login.', body };
};
A.stSave = async () => { await api('/admin/settings', 'PUT', { monthlyFee: num(V('st_fee')), bankDetails: $('#st_bank').value, whatsapp: V('st_wa'), trialDays: num(V('st_trial')), graceDays: num(V('st_grace')), adminName: V('st_aname'), adminLogin: V('st_alogin'), newPassword: $('#st_apass').value }); toast('Saved'); render(); };

/* ---------- start ---------- */
if (location.protocol === 'file:' && !window.STANDALONE) {
  document.body.innerHTML = '<div style="max-width:560px;margin:8vh auto;padding:20px;font-family:sans-serif;line-height:1.7"><h2>BIZKHATA</h2><p><b>This page was opened as a file, so it cannot reach the server.</b><br>یہ فائل سیدھی کھولی گئی ہے، اس لیے سرور سے رابطہ نہیں ہو سکتا۔</p><ol><li>Open a terminal in the bizkhata folder and run: <code>npm start</code></li><li>Then open <b>http://localhost:3000</b> in the browser.</li></ol></div>';
} else {
if (!location.hash) location.hash = TOKEN ? (ROLE === 'admin' ? '#/s-companies' : '#/home') : '#/login';
render();
}

</script>
</body>
</html>
