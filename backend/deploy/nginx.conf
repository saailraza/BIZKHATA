# /etc/nginx/sites-available/bizkhata   (replace khata.example.com with your domain)
# then:  ln -s /etc/nginx/sites-available/bizkhata /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS (free):  certbot --nginx -d khata.example.com
server {
    listen 80;
    server_name khata.example.com;

    client_max_body_size 10m;           # bank slips and backup files

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        alias /opt/bizkhata/public/assets/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
